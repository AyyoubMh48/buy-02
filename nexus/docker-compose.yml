services:
  nexus:
    # Sonatype publishes this exact release tag; 3.98.1 contains Nexus 3.98.1-01.
    image: sonatype/nexus3:3.98.1
    container_name: ${NEXUS_CONTAINER_NAME:-buy02-nexus}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_HOST_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://127.0.0.1:8081/service/rest/v1/status
          && curl --fail --silent --show-error http://127.0.0.1:8081/service/rest/v1/status/writable
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  nexus-data:
    name: ${NEXUS_VOLUME_NAME:-buy02-nexus-data}
