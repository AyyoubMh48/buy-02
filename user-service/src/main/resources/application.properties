spring.config.import=optional:file:./.env[.properties]

spring.application.name=user-service

# server.port=${PORT:8081}
port=8080

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/buy01_users}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/buy01_users}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

media-service.base-url=${MEDIA_SERVICE_URL:http://media-service:8083/media/images}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always