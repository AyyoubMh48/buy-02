server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/gateway-keystore.crt;
    ssl_certificate_key /etc/nginx/certs/gateway-keystore.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_page 497 =301 https://$http_host$request_uri;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://gateway:8080/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 4200;
    }

    location ~ ^/(auth|me|media|actuator)(/|$) {
        proxy_pass https://gateway:8080;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 4200;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
