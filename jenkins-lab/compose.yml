services:

  docker:
    image: docker:dind
    container_name: jenkins-docker

    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    privileged: true
    restart: unless-stopped

    environment:
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins_home:/var/jenkins_home

    networks:
      - jenkins-network


  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins

    container_name: jenkins

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

    depends_on:
      docker:
        condition: service_healthy

    ports:
      - "8085:8080"
      - "50000:50000"

    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"

    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro

    networks:
      - jenkins-network


networks:
  jenkins-network:


volumes:
  jenkins_home:
  jenkins-docker-certs:
