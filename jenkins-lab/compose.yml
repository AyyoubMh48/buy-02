services:

  # ==========================================
  # Docker daemon for Jenkins
  # ==========================================

  docker:

    image: docker:dind

    container_name: jenkins-docker

    privileged: true

    restart: unless-stopped

    environment:
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      - jenkins-docker-tls:/certs
      - jenkins-docker-certs:/certs/client
      - jenkins_home:/var/jenkins_home
      - jenkins-docker-data:/var/lib/docker

    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    ports:
      4200:4200

    networks:
      - jenkins-network


  # ==========================================
  # Jenkins Controller
  # ==========================================

  jenkins:

    build:
      context: .
      dockerfile: Dockerfile.jenkins

    container_name: jenkins

    restart: unless-stopped

    depends_on:
      docker:
        condition: service_healthy

    ports:
      - "8085:8080"
      - "50000:50000"

    environment:

      # Docker daemon
      DOCKER_HOST: tcp://docker:2376

      DOCKER_CERT_PATH: /certs/client

      DOCKER_TLS_VERIFY: "1"


      # ======================================
      # Jenkins Configuration as Code
      # ======================================

      CASC_JENKINS_CONFIG: /casc/jenkins.yaml

      CASC_STRICT_SECRET_RESOLUTION: "true"

      SECRETS: /run/secrets


      # Skip Jenkins setup wizard
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"


    volumes:

      # Jenkins persistent data
      - jenkins_home:/var/jenkins_home

      # Docker TLS
      - jenkins-docker-certs:/certs/client:ro

      # JCasC files
      - type: bind
        source: ./jcasc
        target: /casc
        read_only: true
        bind:
          create_host_path: false

      # Secrets
      - type: bind
        source: ./jenkins-secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false


    networks:
      - jenkins-network



# ==========================================
# Network
# ==========================================

networks:

  jenkins-network:



# ==========================================
# Volumes
# ==========================================

volumes:

  jenkins_home:

  jenkins-docker-certs:

  jenkins-docker-data:

  # Persist the CA and server certificates as well as the existing client volume.
  jenkins-docker-tls:
