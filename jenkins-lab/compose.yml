services:

  # ==========================================
  # Docker daemon for Jenkins
  # ==========================================

  docker:

    image: docker@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0

    container_name: jenkins-docker

    privileged: true

    restart: unless-stopped

    environment:
      DOCKER_TLS_CERTDIR: /certs

    volumes:
      - jenkins-docker-tls:/certs
      - jenkins-docker-certs:/certs/client
      - jenkins_home:/var/jenkins_home
      - jenkins-docker-data:/var/lib/docker

    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


    ports:
      - "4200:4200"

    networks:
      - jenkins-network


  # ==========================================
  # Jenkins Controller
  # ==========================================

  jenkins:

    build:
      context: .
      dockerfile: Dockerfile.jenkins

    container_name: jenkins

    restart: unless-stopped

    depends_on:
      docker:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

    ports:
      - "8085:8080"
      - "50000:50000"

    environment:

      # Docker daemon
      DOCKER_HOST: tcp://docker:2376

      DOCKER_CERT_PATH: /certs/client

      DOCKER_TLS_VERIFY: "1"


      # ======================================
      # Jenkins Configuration as Code
      # ======================================

      CASC_JENKINS_CONFIG: /casc/jenkins.yaml

      CASC_STRICT_SECRET_RESOLUTION: "true"

      SECRETS: /run/secrets


      # Skip Jenkins setup wizard
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"


    volumes:

      # Jenkins persistent data
      - jenkins_home:/var/jenkins_home

      # Docker TLS
      - jenkins-docker-certs:/certs/client:ro

      # JCasC files
      - type: bind
        source: ./jcasc
        target: /casc
        read_only: true
        bind:
          create_host_path: false

      # Secrets
      - type: bind
        source: ./jenkins-secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false


    networks:
      - jenkins-network


  sonar-db:
    image: postgres@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jenkins-network

  sonarqube:
    image: sonarqube@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - jenkins-network

  sonar-init:
    image: python:3.13.7-slim-bookworm
    profiles: ["bootstrap"]
    restart: "no"
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      JENKINS_WEBHOOK_URL: http://jenkins:8080/sonarqube-webhook/
    command: ["python3", "/bootstrap/bootstrap.py"]
    volumes:
      - ./sonar-init:/bootstrap:ro
      - ./jenkins-secrets:/run/secrets
    networks:
      - jenkins-network

# ==========================================
# Network
# ==========================================

networks:

  jenkins-network:



# ==========================================
# Volumes
# ==========================================

volumes:

  jenkins_home:

  jenkins-docker-certs:

  jenkins-docker-data:

  # Persist the CA and server certificates as well as the existing client volume.
  jenkins-docker-tls:
  sonar_postgres_data:
    name: ${SONAR_POSTGRES_VOLUME:-sonar-lab_sonar_postgres_data}
  sonar_data:
    name: ${SONAR_DATA_VOLUME:-sonar-lab_sonar_data}
  sonar_logs:
    name: ${SONAR_LOGS_VOLUME:-sonar-lab_sonar_logs}
  sonar_extensions:
    name: ${SONAR_EXTENSIONS_VOLUME:-sonar-lab_sonar_extensions}
