server.port=${SERVER_PORT:8084}

spring.application.name=order-service
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27021/order_service_db}
spring.data.mongodb.auto-index-creation=true


eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082/products}
orders-service.base-url=${ORDERS_SERVICE_URL:http://localhost:8084/orders}
# Spring Boot 4 Mongo property (legacy property above retained for compatibility).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27021/order_service_db}
